<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Covid-19 Awareness Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-family-awesome/6.4.0/css/all.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body>
  <header class="bg-indigo-50/50 relative overflow-hidden pb-16 pt-6">
    <div class="max-w-7xl mx-auto px-6 lg:px-8">
      <nav class="flex items-center justify-between py-4">
        <div class="text-2xl font-bold text-purple-700 flex items-center gap-1">
          covid<span class="text-red-500">.</span>
        </div>
        <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
          <a href="#" class="text-purple-700">Home</a>
          <a href="#" class="hover:text-purple-700 transition">Reports</a>
          <a href="#" class="hover:text-purple-700 transition">Centers</a>
          <a href="#" class="hover:text-purple-700 transition">About</a>
          <a href="#" class="hover:text-purple-700 transition">Symptoms</a>
          <a href="#" class="hover:text-purple-700 transition">Contact</a>
        </div>

        <!-- Menu Toggle -->
        <div class="menu-toggle md:hidden">
          <i class="fa-solid fa-bars text-purple-700 text-xl cursor-pointer"></i>
        </div>
      </nav>
      <!--Hero Section-->
      <div class="mt-12 flex justify-between gap-12 items-center">
        <div>
          <span class="text-sm font-semibold text-purple-600 uppercase tracking-wider">COVID-19 Awareness</span>
          <h1 class="text-4xl sm:text-5xl font-extrabold mt-2 leading-tight text-[#6F42C1]">
            Stay Safe. Stay Home.
          </h1>
          <p class="mt-4 text-slate-500 max-w-md">
            A novel coronavirus is a new coronavirus that has not been previously identified. The virus causing coronavirus disease 2019 (COVID-19).
          </p>
          <div class="mt-8">
            <a href="#" class="bg-purple-600 hover:bg-purple-700 text-white font-medium px-8 py-3 rounded-full transition shadow-lg shadow-purple-200 text-sm">
              How To Protect
            </a>
          </div>
        </div>

        <div class="relative flex justify-center lg:justify-end">
          <div class="w-full max-w-md bg-purple-200 rounded-b-full p-4 pt-12 flex justify-center items-end h-[350px] relative">
            <img src="./image/hero-image.png" alt="Medical Workers">

          </div>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
